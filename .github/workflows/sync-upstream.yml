name: Sync upstream rockorager/go-jmap

# Keeps this fork in step with git.sr.ht/~rockorager/go-jmap, the module's
# own repository (the GitHub repository of the same name stopped in 2023 and
# carries a commit the module does not, so it is not the upstream):
#   1. Fast-forwards `main` (clean mirror) to upstream's `main` tip daily.
#   2. Rebases `yarilo-patches` (= main + our patches + this workflow) onto the
#      new `main`. On clean rebase: force-push with lease. On conflict: open an
#      issue tagged `upstream-conflict` so we notice.
#   3. Polls every upstream PR in the watch list. When one lands, or is closed
#      without merging, opens an issue with the next step.
#
# Triggered daily (06:00 UTC) and on demand via workflow_dispatch.
# All ops run inside this fork; no upstream write access needed.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  mirror-main:
    name: Fast-forward main from upstream
    runs-on: ubuntu-latest
    outputs:
      advanced: ${{ steps.advance.outputs.advanced }}
      old_sha: ${{ steps.advance.outputs.old_sha }}
      new_sha: ${{ steps.advance.outputs.new_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name 'yarilo-sync-bot'
          git config user.email 'yarilo-sync-bot@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream https://git.sr.ht/~rockorager/go-jmap
          git fetch upstream main --tags

      - name: Detect divergence and advance main
        id: advance
        run: |
          OLD=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          echo "old_sha=$OLD" >> "$GITHUB_OUTPUT"
          echo "new_sha=$UPSTREAM" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$UPSTREAM" ]; then
            echo "advanced=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main already at upstream tip ($OLD)"
            exit 0
          fi
          # Refuse if our main has commits upstream does not (mirror invariant).
          if ! git merge-base --is-ancestor HEAD upstream/main; then
            echo "::error::main mirror has diverged from upstream/main — manual fix required"
            exit 1
          fi
          AHEAD=$(git rev-list --count "$OLD..$UPSTREAM")
          echo "::notice::Fast-forwarding main by $AHEAD commit(s): $OLD -> $UPSTREAM"
          git merge --ff-only upstream/main
          git push origin main
          echo "advanced=true" >> "$GITHUB_OUTPUT"

  rebase-patches:
    name: Rebase yarilo-patches onto main
    needs: mirror-main
    if: needs.mirror-main.outputs.advanced == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: yarilo-patches
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name 'yarilo-sync-bot'
          git config user.email 'yarilo-sync-bot@users.noreply.github.com'

      - name: Fetch updated main
        run: git fetch origin main

      - name: Attempt rebase
        id: rebase
        run: |
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::yarilo-patches already on top of main — no rebase needed"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          if git -c rerere.enabled=true rebase origin/main; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            git rebase --abort || true
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.needed == 'true' && steps.rebase.outputs.ok == 'true'
        run: |
          git push --force-with-lease origin yarilo-patches
          echo "::notice::yarilo-patches rebased and force-pushed"

      - name: Open conflict issue
        if: steps.rebase.outputs.needed == 'true' && steps.rebase.outputs.ok == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            const oldSha = '${{ needs.mirror-main.outputs.old_sha }}';
            const newSha = '${{ needs.mirror-main.outputs.new_sha }}';
            const title = `upstream-sync: yarilo-patches rebase conflict (main ${newSha.slice(0,7)})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-conflict',
            });
            if (existing.data.some(i => i.title.startsWith('upstream-sync: yarilo-patches rebase conflict'))) {
              core.info('Conflict issue already open — skipping');
              return;
            }
            const compareUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${oldSha}...${newSha}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['upstream-conflict', 'automation'],
              body: [
                '**Automated rebase failed.**',
                '',
                `\`main\` advanced from \`${oldSha}\` to \`${newSha}\` ([compare](${compareUrl})), but rebasing \`yarilo-patches\` on top produced conflicts.`,
                '',
                'Manual steps:',
                '```',
                'git fetch origin',
                'git checkout yarilo-patches',
                'git rebase origin/main',
                '# resolve conflicts, then:',
                'git push --force-with-lease origin yarilo-patches',
                '```',
                '',
                'After resolving, remember to bump the yarilo `go.mod` replace pseudo-version to the new tip.',
              ].join('\n'),
            });

  # The watch list, one JSON array: a row goes in with every cherry-pick, the
  # same day it lands in YARILO_PATCHES.md. A patch in the table and not in
  # this list is a patch nobody is watching. Empty while there are no patches;
  # an empty matrix is an error in Actions, so watch-prs is skipped instead.
  watch-list:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - id: list
        run: echo 'prs=[]' >> "$GITHUB_OUTPUT"

  watch-prs:
    name: Watch upstream PRs (${{ matrix.pr.number }})
    needs: watch-list
    if: needs.watch-list.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.watch-list.outputs.prs) }}
    steps:
      - name: Check PR ${{ matrix.pr.number }} status
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ matrix.pr.number }}
          PR_TOPIC: ${{ matrix.pr.topic }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const prTopic = process.env.PR_TOPIC;
            const label = `upstream-pr-${prNumber}`;
            const pr = await github.rest.pulls.get({
              owner: 'rockorager',
              repo: 'go-jmap',
              pull_number: prNumber,
            });
            core.info(`PR #${prNumber} (${prTopic}) state=${pr.data.state} merged=${pr.data.merged}`);
            if (!pr.data.merged && pr.data.state !== 'closed') {
              core.info('PR still open — no action');
              return;
            }
            const marker = pr.data.merged ? 'merged' : 'closed-unmerged';
            const issueTitle = `upstream-sync: PR #${prNumber} ${marker} — drop our cherry-pick`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: label,
              per_page: 50,
            });
            if (existing.data.some(i => i.title === issueTitle)) {
              core.info('Tracking issue already exists — skipping');
              return;
            }
            const body = pr.data.merged
              ? [
                  `Upstream **rockorager/go-jmap#${prNumber}** (${prTopic}) was merged (commit \`${pr.data.merge_commit_sha}\`).`,
                  '',
                  'Action items:',
                  '- [ ] Bump the main mirror past the merge commit (this workflow does it on next run).',
                  `- [ ] Drop PR #${prNumber}'s cherry-pick(s) from \`yarilo-patches\`.`,
                  '- [ ] Update `YARILO_PATCHES.md` and remove the row from the watch list.',
                  '- [ ] In yarilo `go.mod`, repoint `replace` to the upstream commit, or drop it when no patches remain and upstream tags a version we can use.',
                ].join('\n')
              : [
                  `Upstream **rockorager/go-jmap#${prNumber}** (${prTopic}) was **closed without merge**.`,
                  '',
                  'We need a long-term plan: keep maintaining the cherry-pick on `yarilo-patches`, or pursue an alternative approach.',
                ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              labels: [label, 'automation'],
              body,
            });

  # GitHub disables a scheduled workflow after 60 days without repository
  # activity; a quiet upstream means no pushes, so the schedule re-enables itself.
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable"
